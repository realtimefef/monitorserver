spring.application.name=monitor-server
server.port=${PORT:8080}

# Database — Render provides DATABASE_URL; fallback to individual vars for local dev
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:monitor_db}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# Email (Lark Suite SMTP) — Primary: noreply@
spring.mail.host=${MAIL_HOST:smtp.larksuite.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:noreply@monitorserver.in}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
app.mail.from=${MAIL_FROM:noreply@monitorserver.in}
app.mail.enabled=${MAIL_ENABLED:true}

# Email — Alerts sender: alerts@
app.mail.alerts.host=${MAIL_ALERTS_HOST:smtp.larksuite.com}
app.mail.alerts.port=${MAIL_ALERTS_PORT:587}
app.mail.alerts.username=${MAIL_ALERTS_USERNAME:alerts@monitorserver.in}
app.mail.alerts.password=${MAIL_ALERTS_PASSWORD:}
app.mail.alerts.from=${MAIL_ALERTS_FROM:alerts@monitorserver.in}

# Email rate limits (Lark Suite: 200/100s global, 450/day/sender)
app.mail.rate-limit.global-per-window=200
app.mail.rate-limit.window-seconds=100
app.mail.rate-limit.daily-per-sender=450
app.mail.rate-limit.daily-per-user=${ALERT_DAILY_LIMIT_PER_USER:50}

# App
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.metrics.retention-days=${METRICS_RETENTION_DAYS:30}

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false
