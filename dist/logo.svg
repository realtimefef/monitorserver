<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle radial highlight -->
  <circle cx="256" cy="220" r="200" fill="#fff" opacity="0.04"/>

  <!-- Monitor body -->
  <rect x="96" y="100" width="320" height="220" rx="24" fill="#1e1b4b" filter="url(#shadow)"/>
  <rect x="96" y="100" width="320" height="220" rx="24" fill="none" stroke="#fff" stroke-width="2" stroke-opacity="0.12"/>

  <!-- Screen -->
  <rect x="116" y="120" width="280" height="176" rx="14" fill="#0f0d2e"/>

  <!-- Pulse line — hero element -->
  <polyline
    points="136,230 170,230 200,180 235,265 270,155 305,245 335,195 376,210"
    fill="none" stroke="url(#pulse)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"
    filter="url(#glow)"/>

  <!-- Glow trail -->
  <polyline
    points="136,230 170,230 200,180 235,265 270,155 305,245 335,195 376,210"
    fill="none" stroke="#a5b4fc" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"
    opacity="0.10"/>

  <!-- Active pulse dot -->
  <circle cx="376" cy="210" r="8" fill="#34d399"/>
  <circle cx="376" cy="210" r="16" fill="#34d399" opacity="0.20"/>

  <!-- Status dots top-right of screen -->
  <circle cx="364" cy="138" r="5" fill="#34d399"/>
  <circle cx="380" cy="138" r="5" fill="#fbbf24"/>

  <!-- Stand neck -->
  <rect x="228" y="324" width="56" height="20" rx="4" fill="#1e1b4b"/>
  <!-- Stand base -->
  <rect x="192" y="348" width="128" height="12" rx="6" fill="#1e1b4b"/>
  <rect x="192" y="348" width="128" height="12" rx="6" fill="none" stroke="#fff" stroke-width="1" stroke-opacity="0.08"/>

  <!-- Metric cards row -->
  <g transform="translate(0, 386)">
    <g transform="translate(96, 0)">
      <rect width="68" height="56" rx="14" fill="#1e1b4b" stroke="#fff" stroke-width="1" stroke-opacity="0.06"/>
      <text x="34" y="24" text-anchor="middle" fill="#818cf8" font-size="12" font-weight="600" font-family="system-ui, sans-serif">CPU</text>
      <text x="34" y="44" text-anchor="middle" fill="#fff" font-size="15" font-weight="700" font-family="system-ui, sans-serif">24%</text>
    </g>
    <g transform="translate(180, 0)">
      <rect width="68" height="56" rx="14" fill="#1e1b4b" stroke="#fff" stroke-width="1" stroke-opacity="0.06"/>
      <text x="34" y="24" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="600" font-family="system-ui, sans-serif">MEM</text>
      <text x="34" y="44" text-anchor="middle" fill="#fff" font-size="15" font-weight="700" font-family="system-ui, sans-serif">61%</text>
    </g>
    <g transform="translate(264, 0)">
      <rect width="68" height="56" rx="14" fill="#1e1b4b" stroke="#fff" stroke-width="1" stroke-opacity="0.06"/>
      <text x="34" y="24" text-anchor="middle" fill="#34d399" font-size="12" font-weight="600" font-family="system-ui, sans-serif">DSK</text>
      <text x="34" y="44" text-anchor="middle" fill="#fff" font-size="15" font-weight="700" font-family="system-ui, sans-serif">45%</text>
    </g>
    <g transform="translate(348, 0)">
      <rect width="68" height="56" rx="14" fill="#1e1b4b" stroke="#fff" stroke-width="1" stroke-opacity="0.06"/>
      <text x="34" y="24" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="600" font-family="system-ui, sans-serif">NET</text>
      <text x="34" y="44" text-anchor="middle" fill="#fff" font-size="15" font-weight="700" font-family="system-ui, sans-serif">12M</text>
    </g>
  </g>
</svg>
