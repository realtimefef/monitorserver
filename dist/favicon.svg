<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <!-- Pulse line — the core identity mark -->
  <polyline
    points="4,18 8,18 11,11 15.5,22 20,8 24,18 28,14"
    fill="none" stroke="url(#line)" stroke-width="2.4"
    stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Live dot -->
  <circle cx="28" cy="14" r="2" fill="#34d399"/>
</svg>
