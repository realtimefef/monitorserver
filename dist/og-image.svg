<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle radial highlight -->
  <circle cx="300" cy="315" r="400" fill="#fff" opacity="0.04"/>

  <!-- ======= LEFT COLUMN: Branding ======= -->

  <!-- Logo icon -->
  <g transform="translate(80, 120)">
    <rect width="64" height="64" rx="16" fill="#1e1b4b" filter="url(#shadow)"/>
    <rect x="12" y="10" width="40" height="28" rx="6" fill="#0f0d2e"/>
    <polyline points="16,28 22,28 26,20 31,34 36,16 41,30 46,24 50,24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle cx="50" cy="24" r="2.5" fill="#34d399"/>
    <rect x="25" y="42" width="14" height="4" rx="2" fill="#312e81"/>
    <rect x="20" y="48" width="24" height="3" rx="1.5" fill="#312e81"/>
  </g>

  <!-- Title -->
  <text x="80" y="248" fill="#fff" font-size="56" font-weight="800" font-family="system-ui, -apple-system, sans-serif" letter-spacing="-1.5">Monitor Server</text>

  <!-- Subtitle -->
  <text x="80" y="292" fill="#c7d2fe" font-size="22" font-weight="400" font-family="system-ui, -apple-system, sans-serif">Real-Time Server Monitoring Dashboard</text>

  <!-- Feature pills -->
  <g transform="translate(80, 330)">
    <rect width="90" height="32" rx="16" fill="#fff" fill-opacity="0.12"/>
    <circle cx="18" cy="16" r="4" fill="#34d399"/>
    <text x="30" y="21" fill="#fff" font-size="12" font-weight="500" font-family="system-ui">CPU</text>

    <rect x="102" width="110" height="32" rx="16" fill="#fff" fill-opacity="0.12"/>
    <circle cx="120" cy="16" r="4" fill="#a78bfa"/>
    <text x="132" y="21" fill="#fff" font-size="12" font-weight="500" font-family="system-ui">Memory</text>

    <rect x="224" width="90" height="32" rx="16" fill="#fff" fill-opacity="0.12"/>
    <circle cx="242" cy="16" r="4" fill="#fbbf24"/>
    <text x="254" y="21" fill="#fff" font-size="12" font-weight="500" font-family="system-ui">Disk</text>

    <rect x="326" width="110" height="32" rx="16" fill="#fff" fill-opacity="0.12"/>
    <circle cx="344" cy="16" r="4" fill="#60a5fa"/>
    <text x="356" y="21" fill="#fff" font-size="12" font-weight="500" font-family="system-ui">Network</text>

    <rect x="448" width="96" height="32" rx="16" fill="#fff" fill-opacity="0.12"/>
    <circle cx="466" cy="16" r="4" fill="#f87171"/>
    <text x="478" y="21" fill="#fff" font-size="12" font-weight="500" font-family="system-ui">Alerts</text>
  </g>

  <!-- Description -->
  <text x="80" y="420" fill="#e0e7ff" font-size="16" font-weight="400" font-family="system-ui, -apple-system, sans-serif" opacity="0.8">Open-source, self-hosted infrastructure monitoring</text>
  <text x="80" y="446" fill="#e0e7ff" font-size="16" font-weight="400" font-family="system-ui, -apple-system, sans-serif" opacity="0.8">with real-time metrics and intelligent alerts.</text>

  <!-- Domain -->
  <text x="80" y="540" fill="#fff" font-size="20" font-weight="700" font-family="system-ui, -apple-system, sans-serif">monitorserver.in</text>

  <!-- ======= RIGHT COLUMN: Dashboard Mockup ======= -->
  <g transform="translate(680, 80)">
    <rect width="440" height="470" rx="20" fill="#1e1b4b" filter="url(#shadow)" fill-opacity="0.9"/>
    <rect width="440" height="470" rx="20" fill="none" stroke="#fff" stroke-width="1" stroke-opacity="0.08"/>

    <!-- Title bar -->
    <rect x="0" y="0" width="440" height="44" rx="20" fill="#0f0d2e"/>
    <rect x="0" y="20" width="440" height="24" fill="#0f0d2e"/>
    <circle cx="24" cy="22" r="5" fill="#ef4444" opacity="0.7"/>
    <circle cx="44" cy="22" r="5" fill="#fbbf24" opacity="0.7"/>
    <circle cx="64" cy="22" r="5" fill="#34d399" opacity="0.7"/>
    <text x="220" y="27" text-anchor="middle" fill="#9ca3af" font-size="12" font-family="system-ui">Dashboard</text>

    <!-- Metric cards -->
    <g transform="translate(16, 60)">
      <rect width="96" height="64" rx="12" fill="#0f0d2e"/>
      <text x="12" y="24" fill="#818cf8" font-size="10" font-weight="500" font-family="system-ui">CPU</text>
      <text x="12" y="48" fill="#fff" font-size="22" font-weight="700" font-family="system-ui">24%</text>

      <rect x="108" width="96" height="64" rx="12" fill="#0f0d2e"/>
      <text x="120" y="24" fill="#a78bfa" font-size="10" font-weight="500" font-family="system-ui">Memory</text>
      <text x="120" y="48" fill="#fff" font-size="22" font-weight="700" font-family="system-ui">61%</text>

      <rect x="216" width="96" height="64" rx="12" fill="#0f0d2e"/>
      <text x="228" y="24" fill="#34d399" font-size="10" font-weight="500" font-family="system-ui">Disk</text>
      <text x="228" y="48" fill="#fff" font-size="22" font-weight="700" font-family="system-ui">45%</text>

      <rect x="324" width="84" height="64" rx="12" fill="#0f0d2e"/>
      <text x="336" y="24" fill="#60a5fa" font-size="10" font-weight="500" font-family="system-ui">Network</text>
      <text x="336" y="48" fill="#fff" font-size="20" font-weight="700" font-family="system-ui">12M</text>
    </g>

    <!-- Chart area -->
    <g transform="translate(16, 142)">
      <rect width="408" height="180" rx="12" fill="#0f0d2e"/>
      <text x="16" y="26" fill="#9ca3af" font-size="11" font-weight="500" font-family="system-ui">System Load — 24h</text>

      <!-- Grid lines -->
      <g opacity="0.06" stroke="#fff" stroke-width="1">
        <line x1="16" y1="60" x2="392" y2="60"/>
        <line x1="16" y1="100" x2="392" y2="100"/>
        <line x1="16" y1="140" x2="392" y2="140"/>
      </g>

      <!-- CPU line -->
      <polyline points="20,130 60,110 100,120 140,80 180,95 220,65 260,78 300,55 340,70 380,60" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Area fill -->
      <polygon points="20,130 60,110 100,120 140,80 180,95 220,65 260,78 300,55 340,70 380,60 380,160 20,160" fill="#6366f1" opacity="0.10"/>

      <!-- Memory line -->
      <polyline points="20,140 60,125 100,135 140,100 180,110 220,85 260,95 300,72 340,82 380,75" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
    </g>

    <!-- Server list -->
    <g transform="translate(16, 340)">
      <rect width="408" height="110" rx="12" fill="#0f0d2e"/>
      <text x="16" y="26" fill="#9ca3af" font-size="11" font-weight="500" font-family="system-ui">Servers</text>
      <!-- Server row 1 -->
      <circle cx="28" cy="52" r="5" fill="#34d399"/>
      <text x="42" y="56" fill="#e0e7ff" font-size="12" font-family="system-ui">prod-web-01</text>
      <text x="310" y="56" fill="#34d399" font-size="11" font-weight="600" font-family="system-ui">Healthy</text>
      <!-- Server row 2 -->
      <circle cx="28" cy="78" r="5" fill="#34d399"/>
      <text x="42" y="82" fill="#e0e7ff" font-size="12" font-family="system-ui">prod-db-01</text>
      <text x="310" y="82" fill="#34d399" font-size="11" font-weight="600" font-family="system-ui">Healthy</text>
      <!-- Server row 3 -->
      <circle cx="28" cy="104" r="5" fill="#fbbf24"/>
      <text x="42" y="108" fill="#e0e7ff" font-size="12" font-family="system-ui">staging-api-01</text>
      <text x="310" y="108" fill="#fbbf24" font-size="11" font-weight="600" font-family="system-ui">Warning</text>
    </g>
  </g>

  <!-- Subtle border -->
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#fff" stroke-width="1" stroke-opacity="0.06"/>
</svg>